<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Empresarial - Inicio de Sesión</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .captcha {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f9fafb;
        }

        .captcha label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            margin: 0;
        }

        .captcha input {
            width: 20px;
            height: 20px;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .registro {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .registro a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🏭</div>

        <h1>Sistema Empresarial</h1>

        <p class="subtitulo">
            Empresa Automotriz
        </p>

        <form id="loginForm">

            <label for="correo">Correo electrónico</label>
            <input 
                type="email" 
                id="correo" 
                placeholder="usuario@empresa.com"
                required
            >

            <label for="password">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Ingresa tu contraseña"
                required
            >

            <div class="captcha">

                <label>
                    <input type="checkbox" id="captcha">
                    No soy un robot
                </label>

            </div>

            <button type="submit">
                INICIAR SESIÓN
            </button>

            <p class="mensaje" id="mensaje"></p>

        </form>

        <p class="registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </p>

    </div>

    <script>

        const formulario = document.getElementById("loginForm");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;
            const captcha = document.getElementById("captcha").checked;
            const mensaje = document.getElementById("mensaje");

            if (!captcha) {
                mensaje.textContent = "Debes confirmar que no eres un robot.";
                mensaje.style.color = "red";
                return;
            }

            if (correo === "" || password === "") {
                mensaje.textContent = "Completa todos los campos.";
                mensaje.style.color = "red";
                return;
            }

            mensaje.textContent = "Datos validados correctamente.";
            mensaje.style.color = "green";

            // Posteriormente conectaremos aquí
            // la autenticación real y el sistema de sesiones.

        });

    </script>

</body>
</html>
